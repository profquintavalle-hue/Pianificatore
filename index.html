<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pianificatore Moduli</title>
<style>
  :root{
    --carta: #F7F2E6;
    --carta-alt: #EFE7D6;
    --inchiostro: #2B241C;
    --inchiostro-tenue: #6B5F4E;
    --bordo: #D9CBAE;
    --teal: #1F5C56;
    --teal-chiaro: #3E7C74;
    --ruggine: #B3492A;
    --oliva: #7C8A4E;
    --ambra: #B8863B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--carta);
    color:var(--inchiostro);
    font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:Georgia, "Iowan Old Style", serif;
    font-weight:600;
    margin:0;
  }
  .app{
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:var(--carta-alt);
    border-right:1px solid var(--bordo);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .sidebar h1{
    font-size:1.15rem;
    color:var(--teal);
    margin-bottom:4px;
    letter-spacing:0.2px;
  }
  .sidebar .sottotitolo{
    font-size:0.75rem;
    color:var(--inchiostro-tenue);
    margin-bottom:18px;
  }
  .tab-piano{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.88rem;
    border:1px solid transparent;
    color:var(--inchiostro);
  }
  .tab-piano:hover{ background:rgba(31,92,86,0.08); }
  .tab-piano.attivo{
    background:var(--carta);
    border-color:var(--bordo);
    font-weight:600;
    color:var(--teal);
  }
  .tab-piano .elimina-tab{
    opacity:0;
    color:var(--ruggine);
    font-size:0.8rem;
    padding:2px 6px;
    border-radius:4px;
  }
  .tab-piano:hover .elimina-tab{ opacity:0.7; }
  .tab-piano .elimina-tab:hover{ opacity:1; background:rgba(179,73,42,0.12); }
  .btn-nuovo-piano{
    margin-top:10px;
    padding:9px 12px;
    border-radius:8px;
    border:1px dashed var(--bordo);
    background:transparent;
    color:var(--inchiostro-tenue);
    cursor:pointer;
    font-size:0.85rem;
    text-align:left;
  }
  .btn-nuovo-piano:hover{ border-color:var(--teal); color:var(--teal); }

  .sezione-cestino{ margin-top:14px; font-size:0.8rem; }
  .sezione-cestino summary{ cursor:pointer; color:var(--inchiostro-tenue); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }
  .sezione-cestino select{ width:100%; margin:8px 0 6px; padding:6px; border:1px solid var(--bordo); border-radius:6px; font-family:inherit; font-size:0.8rem; background:#fff; }
  .sezione-cestino .riga-cestino{ display:flex; justify-content:space-between; align-items:center; gap:6px; padding:5px 0; border-bottom:1px dashed var(--bordo); }
  .sezione-cestino .data-cestino{ font-size:0.7rem; color:var(--inchiostro-tenue); }
  .btn-piccolo{ font-family:inherit; font-size:0.75rem; padding:4px 10px; border-radius:6px; border:1px solid var(--bordo); background:#fff; cursor:pointer; color:var(--teal); }
  .btn-piccolo:hover{ border-color:var(--teal); }
  .btn-piccolo.rosso{ color:var(--ruggine); }
  .btn-piccolo.rosso:hover{ border-color:var(--ruggine); }
  .btn-piccolo:disabled{ opacity:0.4; cursor:default; }
  .sezione-backup{
    margin-top:auto;
    padding-top:18px;
    border-top:1px solid var(--bordo);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .titolo-backup{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--inchiostro-tenue);
    font-weight:600;
    margin-bottom:2px;
  }
  .btn-backup{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--bordo);
    background:var(--carta);
    color:var(--inchiostro);
    cursor:pointer;
    font-size:0.82rem;
    text-align:left;
    font-family:inherit;
  }
  .btn-backup:hover{ border-color:var(--teal); color:var(--teal); }
  .nota-backup{
    font-size:0.7rem;
    color:var(--inchiostro-tenue);
    line-height:1.4;
    margin-top:2px;
  }
  .nota-backup.ok{ color:var(--oliva); font-weight:600; }
  .nota-backup.errore{ color:var(--ruggine); font-weight:600; }

  .main{ padding:28px 36px 60px; overflow-x:auto; }
  .vuoto{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:70vh;
    color:var(--inchiostro-tenue);
    text-align:center;
    gap:10px;
  }
  .vuoto button{
    margin-top:8px;
    padding:10px 18px;
    border-radius:8px;
    border:none;
    background:var(--teal);
    color:var(--carta);
    cursor:pointer;
    font-size:0.9rem;
  }

  .intestazione-piano{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:6px;
  }
  .intestazione-piano input[type=text]{
    font-family:Georgia, serif;
    font-size:1.5rem;
    font-weight:600;
    color:var(--teal);
    border:none;
    background:transparent;
    padding:2px 4px;
    border-bottom:1px solid transparent;
  }
  .intestazione-piano input[type=text]:focus{ outline:none; border-bottom:1px solid var(--bordo); }
  .sotto-intestazione{ font-size:0.82rem; color:var(--inchiostro-tenue); margin-bottom:22px; }

  .pannello{
    background:var(--carta);
    border:1px solid var(--bordo);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:20px;
  }
  .pannello summary{
    cursor:pointer;
    font-family:Georgia, serif;
    font-weight:600;
    color:var(--teal);
    font-size:1rem;
    outline:none;
  }
  .pannello[open] summary{ margin-bottom:14px; }

  .riga-campi{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:12px; }
  .campo{ display:flex; flex-direction:column; gap:4px; font-size:0.8rem; color:var(--inchiostro-tenue); }
  .campo input[type=date], .campo input[type=text], .campo input[type=number]{
    border:1px solid var(--bordo);
    border-radius:6px;
    padding:7px 9px;
    font-size:0.85rem;
    background:var(--carta);
    color:var(--inchiostro);
    font-family:inherit;
  }
  .giorni-settimana{ display:flex; gap:6px; flex-wrap:wrap; }
  .giorno-chip{
    padding:6px 10px;
    border-radius:16px;
    border:1px solid var(--bordo);
    font-size:0.78rem;
    cursor:pointer;
    color:var(--inchiostro-tenue);
    user-select:none;
  }
  .giorno-chip.attivo{ background:var(--teal); border-color:var(--teal); color:var(--carta); }

  table.tabella-moduli{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  table.tabella-moduli th{
    text-align:left;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--inchiostro-tenue);
    border-bottom:1px solid var(--bordo);
    padding:6px 8px;
    font-weight:600;
  }
  table.tabella-moduli td{
    padding:6px 8px;
    border-bottom:1px solid rgba(217,203,174,0.5);
    vertical-align:middle;
  }
  table.tabella-moduli input[type=text]{
    width:100%;
    border:1px solid var(--bordo);
    background:#FFFDF8;
    padding:5px 6px;
    border-radius:5px;
    font-size:0.85rem;
    font-family:inherit;
    color:var(--inchiostro);
  }
  table.tabella-moduli input[type=text]:hover, table.tabella-moduli input[type=text]:focus{
    border-color:var(--ruggine, #B5652B); background:#FFFFFF; outline:none;
  }
  table.tabella-moduli input[type=number]{
    width:56px;
    border:1px solid var(--bordo);
    border-radius:5px;
    padding:5px 6px;
    font-size:0.85rem;
    text-align:center;
    font-family:inherit;
  }
  .azione-icona{
    background:none; border:none; cursor:pointer; color:var(--inchiostro-tenue);
    font-size:0.95rem; padding:3px 6px; border-radius:5px;
  }
  .azione-icona:hover{ background:var(--carta-alt); color:var(--inchiostro); }
  .azione-icona.elimina:hover{ color:var(--ruggine); }
  .btn-aggiungi{
    margin-top:12px;
    padding:7px 14px;
    border-radius:6px;
    border:1px dashed var(--bordo);
    background:transparent;
    color:var(--inchiostro-tenue);
    cursor:pointer;
    font-size:0.82rem;
  }
  .btn-aggiungi:hover{ border-color:var(--teal); color:var(--teal); }

  .riga-argomenti-modulo td{ padding:0 8px 4px 44px !important; border-bottom:none !important; }
  .riga-verifiche-modulo td{
    padding:2px 8px 8px 44px !important;
    border-bottom:1px solid rgba(217,203,174,0.5) !important;
    background:rgba(184,134,59,0.04);
  }
  .riga-verifica-inline{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:0.78rem; color:var(--inchiostro-tenue);
    padding:4px 0;
  }
  .riga-verifica-inline select{
    padding:4px 6px; border:1px solid var(--bordo); border-radius:5px;
    font-family:inherit; font-size:0.78rem; background:var(--carta); color:var(--inchiostro);
  }
  .riga-verifica-inline input[type=number]{
    width:44px; padding:3px 5px; border:1px solid var(--bordo); border-radius:5px;
    font-size:0.78rem; text-align:center; font-family:inherit;
  }
  .riga-verifica-inline .mini-label{ display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .moduli-verifica{ position:relative; }
  .btn-moduli-verifica{ max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    padding:5px 9px; border:1px solid var(--bordo); border-radius:6px; background:#fff; color:inherit;
    font-family:inherit; font-size:0.78rem; cursor:pointer; vertical-align:middle; }
  .btn-moduli-verifica:hover{ border-color:var(--ambra); }
  .pannello-moduli-verifica{ position:absolute; z-index:20; top:120%; left:0; width:290px; max-height:260px; overflow:auto;
    background:#fff; border:1px solid var(--bordo); border-radius:8px; padding:8px 10px;
    box-shadow:0 6px 18px rgba(90,70,40,.16); display:flex; flex-direction:column; gap:4px; }
  .pannello-moduli-verifica[hidden]{ display:none; }
  .riga-modulo-verifica{ display:flex; align-items:flex-start; gap:6px; font-size:0.78rem; line-height:1.3; }
  .riga-verifica-inline .badge-verifica{ color:var(--ambra); font-weight:700; }
  .riga-verifica-inline .data-verifica{ font-weight:600; font-size:0.76rem; white-space:nowrap; }
  .riga-verifica-inline input[type=date]{ padding:3px 5px; border:1px solid var(--bordo); border-radius:5px; font-size:0.76rem; font-family:inherit; }
  .riga-verifica-inline .tag-auto{ font-size:0.72rem; color:var(--ambra); background:rgba(184,134,59,0.12); padding:2px 7px; border-radius:10px; white-space:nowrap; }
  .riga-verifica-inline .link-auto{ font-size:0.72rem; color:var(--teal); background:none; border:none; cursor:pointer; padding:2px 4px; white-space:nowrap; }
  .riga-verifica-inline .link-auto:hover{ text-decoration:underline; }
  .riga-verifica-inline .avviso-inline{ font-size:0.72rem; color:var(--ruggine); white-space:nowrap; }
  .riga-verifica-inline .check-prevista{ font-weight:600; color:var(--inchiostro); }
  .riga-verifica-inline.non-attiva{ opacity:0.5; }
  .riga-verifica-inline.non-attiva select, .riga-verifica-inline.non-attiva input[type=number], .riga-verifica-inline.non-attiva input[type=date]{ text-decoration:line-through; }
  .btn-aggiungi-verifica-inline{
    margin-top:2px;
    padding:3px 10px;
    border-radius:5px;
    border:1px dashed var(--bordo);
    background:transparent;
    color:var(--inchiostro-tenue);
    cursor:pointer;
    font-size:0.74rem;
  }
  .btn-aggiungi-verifica-inline:hover{ border-color:var(--ambra); color:var(--ambra); }

  .lista-eccezioni{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .numero-modulo{ display:inline-block; min-width:22px; margin-right:8px; text-align:right;
    font-size:0.78rem; font-weight:700; color:var(--ambra); vertical-align:middle; }
  .input-nome-modulo{ width:calc(100% - 34px); }
  .nota-verifica{ display:block; font-size:0.68rem; opacity:.6; }
  .riga-etichetta{ display:flex; align-items:center; gap:8px; margin:-4px 0 12px; flex-wrap:wrap; }
  .riga-etichetta select{ padding:6px 10px; border:1px solid var(--bordo); border-radius:6px;
                          font-family:inherit; font-size:0.83rem; background:#fff; color:inherit; }
  .nota-etichetta{ font-size:0.75rem; opacity:.6; }
  .blocco-incolla{ margin-top:10px; border:1px dashed var(--bordo); border-radius:8px; padding:10px 12px; }
  .blocco-incolla summary{ cursor:pointer; font-size:0.83rem; font-weight:600; color:var(--teal); }
  .blocco-incolla textarea{ width:100%; padding:8px 10px; border:1px solid var(--bordo); border-radius:6px;
                            font-family:inherit; font-size:0.83rem; resize:vertical; margin-bottom:8px; }
  .riga-precompila{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:0.83rem; margin-bottom:6px; }
  .riga-precompila input[type=number]{ width:70px; padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; }
  .riga-precompila input[type=text]{ width:150px; padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; font-family:inherit; }
  .riga-precompila select{ padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; font-family:inherit; font-size:0.83rem; background:#fff; max-width:340px; }
  .chk-sel-modulo{ width:17px; height:17px; accent-color:var(--teal); cursor:pointer; margin:0 4px 0 0; vertical-align:middle; }
  tr.modulo-selezionato > td{ background:rgba(179,73,42,0.08); }
  .barra-sposta-moduli{ position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:200; max-width:92vw; display:flex; align-items:center; flex-wrap:wrap; gap:8px;
    margin:0; padding:9px 12px; background:#FBEFE6; border:1px solid var(--ruggine); border-radius:8px;
    font-size:0.83rem; box-shadow:0 4px 10px rgba(179,73,42,0.12); }
  .barra-sposta-moduli b{ color:var(--ruggine); }
  .barra-sposta-moduli select{ padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; font-family:inherit; font-size:0.83rem; background:#fff; max-width:340px; }
  .riga-posizione{ margin:10px 0 8px; padding:8px 12px; background:#FFF6E8; border:1px solid var(--bordo); border-radius:8px; }
  .riga-posizione span{ font-weight:600; }
  .riga-precompila .sep{ margin-left:-4px; opacity:.65; }
  .riga-precompila .chk{ display:flex; align-items:center; gap:4px; opacity:.8; }
  .btn-precompila{ padding:6px 12px; border:1px solid var(--teal); border-radius:6px; background:#fff; color:var(--teal);
                   font-family:inherit; font-size:0.83rem; font-weight:600; cursor:pointer; }
  .btn-precompila:hover{ background:var(--teal); color:#fff; }
  .nota-precompila{ font-size:0.75rem; opacity:.65; margin-bottom:8px; }
  .riga-eccezione{ display:flex; align-items:center; gap:10px; font-size:0.83rem; }
  .riga-eccezione input[type=date]{ padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; }
  .riga-eccezione input[type=text]{ flex:1; padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; font-family:inherit; }
  .badge-tipo{
    font-size:0.7rem; padding:2px 8px; border-radius:10px; font-weight:600;
  }
  .badge-tipo.saltata{ background:rgba(179,73,42,0.14); color:var(--ruggine); }
  .badge-tipo.extra{ background:rgba(124,138,78,0.16); color:var(--oliva); }

  /* GANTT */
  .gantt-wrap{ margin-top:8px; }
  .gantt-riepilogo{
    display:flex; gap:22px; margin-bottom:16px; font-size:0.82rem; color:var(--inchiostro-tenue);
  }
  .gantt-riepilogo b{ color:var(--inchiostro); }
  .tab-riepilogo{ width:100%; border-collapse:collapse; margin:4px 0 16px; font-size:0.82rem; }
  .tab-riepilogo th, .tab-riepilogo td{ padding:6px 10px; text-align:left; border-bottom:1px solid var(--bordo); }
  .tab-riepilogo th{ font-size:0.72rem; text-transform:uppercase; letter-spacing:.05em; opacity:.7; }
  .tab-riepilogo td:not(:first-child), .tab-riepilogo th:not(:first-child){ text-align:center; width:70px; }
  .tab-riepilogo .riga-totale td{ font-weight:700; border-bottom:none; }
  .banner-sforo{
    background:rgba(179,73,42,0.1); border:1px solid rgba(179,73,42,0.35); color:var(--ruggine);
    border-radius:8px; padding:11px 15px; margin-bottom:14px; font-size:0.88rem; line-height:1.5;
  }
  .banner-sforo b{ color:var(--ruggine); }
  .banner-ok{
    background:rgba(124,138,78,0.1); border:1px solid rgba(124,138,78,0.3); color:var(--oliva);
    border-radius:8px; padding:11px 15px; margin-bottom:14px; font-size:0.88rem; line-height:1.5;
  }
  .banner-ok b{ color:var(--oliva); }
  .gantt-scroll{ overflow-x:auto; border:1px solid var(--bordo); border-radius:10px; background:var(--carta); }
  .gantt{ position:relative; min-width:900px; padding:14px 20px 20px; }
  .gantt-mesi{
    display:flex;
    border-bottom:1px solid var(--bordo);
    margin-bottom:10px;
    padding-bottom:6px;
  }
  .gantt-mese-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--inchiostro-tenue);
    border-left:1px solid var(--bordo);
    padding-left:8px;
  }
  .riga-gantt{
    position:relative;
    height:40px;
    border-bottom:1px dashed rgba(217,203,174,0.6);
  }
  .riga-gantt:last-child{ border-bottom:none; }
  .riga-gantt .etichetta-modulo{
    position:absolute;
    left:0; top:0;
    font-size:0.78rem;
    color:var(--inchiostro-tenue);
    line-height:40px;
    pointer-events:none;
  }
  .barra-modulo{
    position:absolute;
    top:7px;
    height:26px;
    border-radius:6px;
    background:var(--teal-chiaro);
    display:flex;
    align-items:center;
    padding:0 10px;
    font-size:0.76rem;
    color:var(--carta);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:left 0.45s cubic-bezier(.4,0,.2,1), width 0.45s cubic-bezier(.4,0,.2,1), background 0.3s;
    box-shadow:0 1px 2px rgba(43,36,28,0.15);
  }
  .barra-modulo.overflow{ background:var(--ruggine); }
  .barra-modulo.corrente{ box-shadow:0 0 0 2px var(--ambra); }
  .oggi-linea{
    position:absolute;
    top:0; bottom:0;
    width:2px;
    background:var(--ruggine);
    opacity:0.55;
  }
  .oggi-etichetta{
    position:absolute;
    top:-16px;
    font-size:0.65rem;
    color:var(--ruggine);
    transform:translateX(-50%);
    white-space:nowrap;
  }
  .verifica-marcatore{
    position:absolute;
    top:0; bottom:0;
    background:rgba(184,134,59,0.18);
    border-left:2px solid var(--ambra);
    border-right:2px solid var(--ambra);
    pointer-events:auto;
  }
  .civica-banda{
    position:absolute;
    top:0; bottom:0;
    background:rgba(168,74,110,0.14);
    border-left:2px solid #A84A6E;
    border-right:2px solid #A84A6E;
  }
  .civica-etichetta{
    position:absolute;
    top:-2px;
    left:2px;
    font-size:0.62rem;
    color:#A84A6E;
    font-weight:700;
    white-space:nowrap;
    background:var(--carta);
    padding:0 3px;
    border-radius:3px;
  }
  .giorno-cella.civica{ background:#A84A6E; color:var(--carta); font-weight:700; }
  .riga-civica{ display:flex; align-items:center; gap:10px; font-size:0.83rem; flex-wrap:wrap; margin-bottom:4px; }
  .riga-civica input[type=text]{ flex:1; min-width:220px; padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; font-family:inherit; }
  .riga-civica input[type=date]{ padding:6px 8px; border:1px solid var(--bordo); border-radius:6px; }

<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <h1>Pianificatore</h1>
    <div class="sottotitolo">Moduli didattici &middot; a cascata &middot; v. 2.10</div>
    <div id="lista-tab"></div>
    <button class="btn-nuovo-piano" id="btn-nuovo-piano">+ nuovo piano (classe/materia)</button>
    <div id="sezione-cestino"></div>
    <div class="sezione-backup">
      <div class="titolo-backup">Backup</div>
      <button class="btn-backup" id="btn-esporta-backup">⤓ Salva backup su file</button>
      <button class="btn-backup" id="btn-importa-backup">⤒ Ripristina da file</button>
      <input type="file" id="input-file-backup" accept=".json,application/json" style="display:none">
      <div class="nota-backup" id="nota-backup">Consiglio: salva il file nel tuo Google Drive dopo modifiche importanti.</div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
const CHIAVE_STORAGE = 'pianificatore_moduli_dati_v1';
const LETTERE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const MATERIE = ['Filosofia','Storia','Educazione civica'];
const GIORNI_LABEL = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const MESI_LABEL = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const PALETTE_BARRE = ['#3E7C74','#B8863B','#7C8A4E','#5B7BA6','#8B6BAA','#A6633E'];

function idCasuale(){ return Math.random().toString(36).slice(2,9); }
function oggiISO(){ return new Date().toISOString().slice(0,10); }

function caricaDati(){
  try{
    const raw = localStorage.getItem(CHIAVE_STORAGE);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error(e); }
  return { piani: [], pianoAttivo: null };
}
function salvaDati(){
  localStorage.setItem(CHIAVE_STORAGE, JSON.stringify(stato));
  ultimaModifica = Date.now();
}

let stato = caricaDati();
if(!stato.festeConfig) stato.festeConfig = { anno: (new Date().getMonth() >= 8 ? new Date().getFullYear() : new Date().getFullYear()-1), nome:'San Saturnino', giorno:30, mese:10 };
if(!Array.isArray(stato.cestino)) stato.cestino = []; // piani eliminati, ripristinabili
if(!Array.isArray(stato.giorniSenzaLezione)) stato.giorniSenzaLezione = []; // registro unico dei giorni senza lezione
if(!Array.isArray(stato.civica)) stato.civica = []; // progetti di educazione civica, per classe
// Promemoria backup: confrontiamo l'ultima modifica con l'ultimo salvataggio su file.
let ultimaModifica = 0;   // impostata da salvaDati()
let ultimoBackup = 0;     // impostata da esportaBackup()

function nuovoPiano(){
  const p = {
    id: idCasuale(),
    nome: 'Nuova materia/classe',
    anno: '', sezione: '', materia: '',
    dataInizio: oggiISO(),
    dataFine: (function(){ const d=new Date(); d.setMonth(d.getMonth()+9); return d.toISOString().slice(0,10); })(),
    giorni: [1,3], // lun, mer di default (0=lun..6=dom)
    festivita: [],
    moduli: [
      { id: idCasuale(), nome: 'Modulo 1', lezioni: 4, verifiche: [] },
      { id: idCasuale(), nome: 'Modulo 2', lezioni: 4, verifiche: [] }
    ],
    eccezioni: [] // {data, tipo: 'saltata'|'extra', etichetta}
  };
  stato.piani.push(p);
  stato.pianoAttivo = p.id;
  salvaDati();
  render();
}

function pianoCorrente(){
  const p = stato.piani.find(p => p.id === stato.pianoAttivo) || null;
  if(p) p.moduli.forEach(m => {
    if(!Array.isArray(m.verifiche)) m.verifiche = [];
    m.verifiche.forEach(v => {
      if(v.attiva === undefined) v.attiva = true;
      if(v.data === undefined) v.data = null;
      if(v.qualifica === 'ordinaria') v.qualifica = 'sommativa';
      // scartoLezioni non è più usato: le date automatiche cadono subito dopo il modulo
    });
  });
  return p;
}

function eliminaPiano(id){
  const p = stato.piani.find(x => x.id === id);
  if(!p) return;
  if(!Array.isArray(stato.cestino)) stato.cestino = [];
  stato.cestino.unshift({ piano: p, eliminatoIl: oggiISO() });
  stato.piani = stato.piani.filter(p => p.id !== id);
  if(stato.pianoAttivo === id){
    stato.pianoAttivo = stato.piani.length ? stato.piani[0].id : null;
  }
  salvaDati();
  render();  mostraNotaBackup('«' + p.nome + '» spostato nel cestino: lo trovi in «Piani eliminati».', 'ok');
}

// ---------- Logica calendario / cascata ----------

function parseISO(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function toISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function giornoSettimanaLunBase(d){
  // JS: 0=domenica..6=sabato -> convertiamo a 0=lunedì..6=domenica
  return (d.getDay() + 6) % 7;
}
function pasquaData(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mese=Math.floor((h+l-7*m+114)/31),giorno=((h+l-7*m+114)%31)+1;
  return new Date(y, mese-1, giorno);
}
function dataPiu(d, n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dataISO(y,m,g){ return toISO(new Date(y, m-1, g)); }

// Genera le festività di un anno scolastico che parte a settembre di annoInizio.
// Le voci generate sono marcate auto:true, così una nuova precompilazione le
// sostituisce senza toccare i ponti aggiunti a mano.
function generaFestivita(annoInizio, patrono){
  const y = annoInizio, y2 = annoInizio + 1;
  const P = pasquaData(y2);
  const mesePat = Number(patrono.mese)||10, giornoPat = Number(patrono.giorno)||30;
  const annoPat = mesePat >= 9 ? y : y2;
  const v = [
    ['San Francesco d\'Assisi', dataISO(y,10,4), dataISO(y,10,4)],
    [(patrono.nome||'Santo patrono'), dataISO(annoPat,mesePat,giornoPat), dataISO(annoPat,mesePat,giornoPat)],
    ['Ognissanti', dataISO(y,11,1), dataISO(y,11,1)],
    ['Immacolata', dataISO(y,12,8), dataISO(y,12,8)],
    ['Vacanze di Natale', dataISO(y,12,23), dataISO(y2,1,6)],
    ['Martedì grasso', toISO(dataPiu(P,-47)), toISO(dataPiu(P,-47))],
    ['Vacanze di Pasqua', toISO(dataPiu(P,-3)), toISO(dataPiu(P,2))],
    ['Anniversario della Liberazione', dataISO(y2,4,25), dataISO(y2,4,25)],
    ['Sa die de sa Sardigna', dataISO(y2,4,28), dataISO(y2,4,28)],
    ['Festa del Lavoro', dataISO(y2,5,1), dataISO(y2,5,1)],
    ['Festa della Repubblica', dataISO(y2,6,2), dataISO(y2,6,2)]
  ];
  return v.map(x => ({ etichetta:x[0], da:x[1], a:x[2], auto:true }));
}

// Sostituisce nel piano le festività generate, conservando quelle manuali.
function precompilaFestivitaPiano(piano, annoInizio, patrono){
  const manuali = piano.festivita.filter(f => !f.auto);
  piano.festivita = generaFestivita(annoInizio, patrono).concat(manuali);
}

// Copia le vacanze aggiunte a mano di un piano negli altri piani, senza doppioni (stesse date).
function copiaVacanzeManuali(origine){
  const manuali = origine.festivita.filter(f => !f.auto);
  let aggiunte = 0;
  stato.piani.forEach(p => {
    if(p === origine) return;
    const presenti = new Set(p.festivita.map(f => f.da + '|' + f.a));
    manuali.forEach(f => {
      if(presenti.has(f.da + '|' + f.a)) return;
      p.festivita.push({ etichetta: f.etichetta, da: f.da, a: f.a });
      aggiunte++;
    });
  });
  return aggiunte;
}

function inFestivita(iso, festivita){
  return (festivita || []).some(f => iso >= f.da && iso <= f.a);
}

// Aggiunge al registro dei giorni senza lezione le festività [{etichetta, da, a}] non ancora coperte.
// Una festività è "coperta" se ogni suo giorno feriale è già nel registro per tutte le classi.
// classi: [] = tutte; altrimenti le classi a cui si applica.
function aggiungiFestivitaAlRegistro(feste, classi){
  let n = 0;
  feste.forEach(f => {
    if(!f.da) return;
    const fine = f.a || f.da;
    let d = parseISO(f.da), scoperto = false;
    while(d <= parseISO(fine)){
      const iso = toISO(d);
      if(giornoSettimanaLunBase(d) < 6){
        const coperto = (stato.giorniSenzaLezione || []).some(g => iso >= g.dal && iso <= (g.al || g.dal) &&
          (!g.classi || !g.classi.length || (classi && classi.length && classi.every(c => g.classi.includes(c)))));
        if(!coperto){ scoperto = true; break; }
      }
      d.setDate(d.getDate()+1);
    }
    if(!scoperto) return;
    stato.giorniSenzaLezione.push({ id: idCasuale(), dal: f.da, al: fine !== f.da ? fine : '', tipo: 'Chiusura / festività',
      chi: 'Niente lezioni a scuola', descrizione: f.etichetta || 'Festività', ore: null, classi: classi || [], protocollo: '', note: '', link: '' });
    n++;
  });
  return n;
}

// v. 2.10: le festività dei singoli piani passano nel registro unico (una volta sola).
// Le vecchie liste restano in stato.festivitaArchivio per sicurezza.
function migraFestivitaNelRegistro(){
  if(!Array.isArray(stato.giorniSenzaLezione)) stato.giorniSenzaLezione = [];
  const conFeste = stato.piani.filter(p => (p.festivita || []).length);
  if(!conFeste.length) return 0;
  const tutteLeClassi = classiDisponibili();
  // raggruppa per periodo: quali classi lo avevano
  const periodi = {};
  conFeste.forEach(p => p.festivita.forEach(f => {
    const k = f.da + '|' + f.a;
    if(!periodi[k]) periodi[k] = { etichetta: f.etichetta, da: f.da, a: f.a, classi: new Set() };
    periodi[k].classi.add(classeDi(p) || p.nome);
  }));
  let n = 0;
  Object.values(periodi).sort((x, y) => x.da < y.da ? -1 : 1).forEach(per => {
    const cl = [...per.classi];
    const perTutte = tutteLeClassi.every(c => cl.includes(c));
    n += aggiungiFestivitaAlRegistro([per], perTutte ? [] : cl.filter(c => tutteLeClassi.includes(c)));
  });
  stato.festivitaArchivio = (stato.festivitaArchivio || []).concat(conFeste.map(p => ({ piano: p.nome, festivita: p.festivita })));
  stato.piani.forEach(p => p.festivita = []);
  return n;
}

// Restituisce l'elenco ordinato di date-lezione (ISO) per un piano,
// tenendo conto di giorni settimanali, festività e eccezioni (saltate/extra)
// ---------- Registro dei giorni senza lezione (unico per tutte le classi) ----------
const TIPI_GSL = ['Malattia','Permesso giornaliero','Permesso orario','Sciopero','Assemblea sindacale',"Assemblea d'istituto",'Chiusura / festività','Uscita didattica','Altro'];
function classeDi(p){ return p.anno && p.sezione ? String(p.anno) + p.sezione : ''; }
function classiDisponibili(){
  return [...new Set(stato.piani.map(classeDi).filter(Boolean))].sort();
}
// La voce del registro che toglie la lezione di quel giorno a quel piano (o null).
function giornoSenzaLezione(iso, piano){
  const cl = classeDi(piano);
  return (stato.giorniSenzaLezione || []).find(g =>
    iso >= g.dal && iso <= (g.al || g.dal) && (!g.classi || !g.classi.length || (cl && g.classi.includes(cl)))) || null;
}
// Lezioni che quella voce toglie, classe per classe (in base all'orario dei piani).
function lezioniPerseGsl(g){
  const out = {};
  stato.piani.forEach(p => {
    const cl = classeDi(p) || p.nome;
    if(g.classi && g.classi.length && !g.classi.includes(cl)) return;
    let d = parseISO(g.dal); const fine = parseISO(g.al || g.dal); let n = 0;
    while(d <= fine){
      const iso = toISO(d);
      if(p.dataInizio && iso >= p.dataInizio && iso <= p.dataFine && p.giorni.includes(giornoSettimanaLunBase(d)) && !inFestivita(iso, p.festivita)) n++;
      d.setDate(d.getDate()+1);
    }
    if(n) out[cl] = (out[cl] || 0) + n;
  });
  return out;
}
function testoDateGsl(g){
  const f = iso => { const d = parseISO(iso); return GIORNI_LABEL[giornoSettimanaLunBase(d)] + ' ' + formattaDataBreve(iso); };
  return g.al && g.al !== g.dal ? 'dal ' + f(g.dal) + ' al ' + f(g.al) : f(g.dal);
}

function calcolaLezioniBase(piano){
  const saltate = new Set(piano.eccezioni.filter(e=>e.tipo==='saltata').map(e=>e.data));
  const extra = piano.eccezioni.filter(e=>e.tipo==='extra').map(e=>e.data);
  const risultato = [];
  if(piano.dataInizio && piano.dataFine){
    let cursore = parseISO(piano.dataInizio);
    const fine = parseISO(piano.dataFine);
    while(cursore <= fine){
      const iso = toISO(cursore);
      const gg = giornoSettimanaLunBase(cursore);
      if(piano.giorni.includes(gg) && !inFestivita(iso, piano.festivita) && !saltate.has(iso) && !giornoSenzaLezione(iso, piano)){
        risultato.push(iso);
      }
      cursore.setDate(cursore.getDate()+1);
    }
  }
  extra.forEach(iso => { if(!risultato.includes(iso)) risultato.push(iso); });
  risultato.sort();
  return risultato;
}

// ---------- Educazione civica ----------
// Ogni progetto vale per una classe (anno + sezione) e prende, a partire dal giorno d'inizio,
// le prime N lezioni dei piani di quella classe (Filosofia e Storia insieme, in ordine di data).
// Quelle lezioni vengono tolte ai moduli, come una festività, ma restano contate come educazione civica.
function stessaClasse(a, b){
  return a.anno && a.sezione && String(a.anno) === String(b.anno) && a.sezione === b.sezione;
}
function progettiCivicaClasse(piano){
  return (stato.civica || []).filter(c => stessaClasse(c, piano));
}
function calcolaCivicaClasse(piano){
  // restituisce, per ogni progetto della classe, le lezioni assegnate { iso, pianoId }
  const fratelli = stato.piani.filter(p => stessaClasse(p, piano));
  const ordineMateria = p => (p.materia === 'Filosofia' ? 0 : 1);
  const tutte = [];
  fratelli.forEach(p => calcolaLezioniBase(p).forEach(iso => tutte.push({ iso, pianoId: p.id, materia: p.materia || p.nome, ordine: ordineMateria(p) })));
  tutte.sort((x, y) => x.iso < y.iso ? -1 : x.iso > y.iso ? 1 : x.ordine - y.ordine);
  const prese = new Set();
  return progettiCivicaClasse(piano)
    .slice().sort((a, b) => (a.inizio || '') < (b.inizio || '') ? -1 : 1)
    .map(c => {
      const n = Math.max(0, Number(c.lezioni) || 0);
      const scelte = [];
      if(c.inizio){
        for(const l of tutte){
          if(scelte.length >= n) break;
          const chiave = l.iso + '|' + l.pianoId;
          if(l.iso < c.inizio || prese.has(chiave)) continue;
          prese.add(chiave); scelte.push(l);
        }
      }
      const perMateria = {};
      scelte.forEach(l => perMateria[l.materia] = (perMateria[l.materia] || 0) + 1);
      return { progetto: c, lezioni: scelte, perMateria, mancanti: n - scelte.length,
               dal: scelte.length ? scelte[0].iso : null, al: scelte.length ? scelte[scelte.length-1].iso : null };
    });
}
function lezioniCivicaDelPiano(piano){
  // [{ iso, progetto }] solo per questo piano
  const out = [];
  calcolaCivicaClasse(piano).forEach(r => r.lezioni.forEach(l => { if(l.pianoId === piano.id) out.push({ iso: l.iso, progetto: r.progetto }); }));
  return out.sort((a, b) => a.iso < b.iso ? -1 : 1);
}
function calcolaLezioniDisponibili(piano){
  const civ = new Set(lezioniCivicaDelPiano(piano).map(l => l.iso));
  return calcolaLezioniBase(piano).filter(iso => !civ.has(iso));
}

// Nomi dei moduli su cui verte la verifica: quello a cui è agganciata più
// gli eventuali altri selezionati (in ordine di piano, anche non contigui).
function moduliDellaVerifica(v, modulo, piano){
  const extra = Array.isArray(v.moduli) ? v.moduli : [];
  const nomi = [];
  (piano ? piano.moduli : [modulo]).forEach(m => {
    if(m.id === modulo.id || extra.includes(m.id)) nomi.push(m.nome);
  });
  return nomi.length ? nomi : [modulo.nome];
}
function etichettaVerifica(v, modulo, piano){
  const tipo = v.tipo === 'orale' ? 'Orale' : 'Scritta';
  const qualifica = v.qualifica === 'recupero' ? 'di recupero' : 'sommativa';
  return tipo + ' ' + qualifica + ' — ' + moduliDellaVerifica(v, modulo, piano).join(', ');
}

// Messaggio chiaro sul perché una verifica non è collocabile.
// esteso=true → testo lungo per il tooltip; esteso=false → etichetta breve.
function messaggioProblemaVerifica(motivo, esteso){
  switch(motivo){
    case 'non-lezione':
      return esteso
        ? 'La data scelta non è un giorno di lezione per questa classe (controlla i giorni della settimana o un periodo di vacanza). Scegli un altro giorno o lascia la data su "auto".'
        : 'non è un giorno di lezione';
    case 'spazio-durata':
      return esteso
        ? 'Da questa data non ci sono abbastanza lezioni disponibili per l\'intera durata della verifica prima della fine del periodo.'
        : 'lezioni insufficienti da qui';
    case 'spazio-dopo-modulo':
      return esteso
        ? 'Non ci sono abbastanza lezioni dopo il modulo per collocare la verifica entro la fine del periodo. Allunga il periodo o riduci le lezioni.'
        : 'niente spazio dopo il modulo';
    default:
      return esteso ? 'La verifica non è collocabile nel periodo indicato.' : 'non collocabile';
  }
}

// Assegna i moduli in sequenza sulle lezioni disponibili.
// Ogni verifica ha una data propria (fissata dall'utente o proposta automaticamente
// subito dopo il suo modulo). Le verifiche attive che "occupano lezioni" riservano
// i loro giorni ovunque cadano: i moduli in corso in quel punto scorrono di conseguenza.
function calcolaPianificazione(piano){
  const lezioni = calcolaLezioniDisponibili(piano);
  const indiceLezione = {}; // iso -> indice
  lezioni.forEach((iso, i)=> indiceLezione[iso] = i);

  const riservate = {};

  // 1) Riserva PRIMA tutte le lezioni delle verifiche con data FISSATA, attive e occupanti,
  //    ovunque cadano (anche in mezzo a un modulo successivo).
  function riservaDaData(iso, durata){
    const start = indiceLezione[iso];
    const indici = [];
    if(start == null){ return { indici, fuori:true, motivo:'non-lezione' }; }
    let count = 0;
    for(let i = start; i < lezioni.length && count < durata; i++){
      indici.push(i); count++;
    }
    return { indici, fuori: indici.length < durata, motivo: indici.length < durata ? 'spazio-durata' : null };
  }

  piano.moduli.forEach(m => {
    (m.verifiche||[]).forEach(v => {
      const attiva = v.attiva !== false;
      const occupano = attiva && v.occupaLezioni !== false;
      if(v.data && occupano){
        const durata = Math.max(1, Number(v.durataLezioni)||1);
        riservaDaData(v.data, durata).indici.forEach(i => riservate[i] = true);
      }
    });
  });

  // 2) Passaggio sequenziale: per ogni modulo assegna le lezioni di spiegazione
  //    (saltando le già riservate), poi colloca subito le sue verifiche a data AUTOMATICA
  //    riservando quei giorni, così il modulo successivo parte dopo di esse.
  let cursore = 0;
  const righe = [];
  let overflowTotale = 0;
  const verifichePianificate = [];

  piano.moduli.forEach(m => {
    const necessarie = Math.max(1, Number(m.lezioni)||1);
    const assegnate = [];
    let idx = cursore;
    while(assegnate.length < necessarie && idx < lezioni.length){
      if(!riservate[idx]) assegnate.push(idx);
      idx++;
    }
    cursore = idx;
    const overflow = assegnate.length < necessarie;
    if(overflow) overflowTotale += (necessarie - assegnate.length);

    let dataInizio, dataFine, ultimoIdx;
    if(assegnate.length > 0){
      dataInizio = lezioni[assegnate[0]];
      dataFine = lezioni[assegnate[assegnate.length-1]];
      ultimoIdx = assegnate[assegnate.length-1];
    } else if(lezioni.length > 0){
      dataInizio = dataFine = lezioni[Math.min(cursore, lezioni.length-1)];
      ultimoIdx = Math.min(cursore, lezioni.length-1);
    } else {
      dataInizio = dataFine = piano.dataInizio;
      ultimoIdx = -1;
    }
    const riga = { modulo: m, dataInizio, dataFine, dataFineTotale: dataFine, lezioniAssegnate: assegnate.length, lezioniPreviste: necessarie, lezioniVerifica: 0, overflow };
    righe.push(riga);

    // verifiche del modulo: prima quelle a data automatica (collocate qui, in ordine),
    // che spingono in avanti il modulo successivo.
    (m.verifiche||[]).forEach(v => {
      const attiva = v.attiva !== false;
      const durata = Math.max(1, Number(v.durataLezioni)||1);
      const occupano = attiva && v.occupaLezioni !== false;
      let indici = [];
      let fuori = false;
      let motivo = null;

      if(v.data){
        const r = riservaDaData(v.data, durata);
        indici = r.indici; fuori = r.fuori; motivo = r.motivo;
      } else {
        let count = 0;
        for(let i = ultimoIdx + 1; i < lezioni.length && count < durata; i++){
          if(riservate[i]) continue;
          indici.push(i); count++;
          if(occupano) riservate[i] = true;
        }
        fuori = indici.length < durata;
        if(fuori) motivo = 'spazio-dopo-modulo';
        if(indici.length) ultimoIdx = Math.max(ultimoIdx, indici[indici.length-1]);
        // dopo una verifica automatica, il cursore dei moduli riparte da lì
        cursore = Math.max(cursore, (indici.length ? indici[indici.length-1] : ultimoIdx) + 1);
      }

      // Conta come "occupate" solo le lezioni effettivamente collocate;
      // le lezioni volute ma non collocabili (fuori periodo) diventano overflow.
      if(occupano){
        riga.lezioniVerifica += indici.length;
        const mancanti = durata - indici.length;
        if(mancanti > 0) overflowTotale += mancanti;
      }
      if(indici.length){
        const ultimaData = lezioni[indici[indici.length-1]];
        if(ultimaData > riga.dataFineTotale) riga.dataFineTotale = ultimaData;
      }
      verifichePianificate.push({
        verifica: v,
        modulo: m,
        etichetta: etichettaVerifica(v, m, piano),
        date: indici.map(i => lezioni[i]),
        attiva,
        dataAutomatica: !v.data,
        fuoriPeriodo: fuori,
        motivoProblema: motivo
      });
    });
  });

  return { lezioni, righe, verifiche: verifichePianificate, overflowTotale, lezioniUsate: cursore, lezioniTotali: lezioni.length, civica: lezioniCivicaDelPiano(piano) };
}


// ---------- Argomenti dei moduli ----------
// Ogni modulo ha un elenco di argomenti con una spunta: nei report escono solo quelli spuntati.
let argomentiAperti = new Set();
let focusArgomento = null;
function pulisciRigaArgomento(r){
  return r.replace(/^[\s\u2022\u00B7\-\u2013\u2014*]+/, '').replace(/^\d+[.)\]]\s*/, '').trim();
}
function argomentiSpuntati(m){
  return (m.argomenti || []).filter(a => a.fatto && (a.testo || '').trim()).map(a => a.testo.trim().replace(/[.;]+$/, ''));
}
function copiaArgomenti(m, conSpunte){
  return (m.argomenti || []).map(a => ({ id: idCasuale(), testo: a.testo, fatto: conSpunte ? !!a.fatto : false }));
}
function applicaFocusArgomento(){
  if(!focusArgomento) return;
  const el = document.querySelector('[data-arg="' + focusArgomento + '"]');
  focusArgomento = null;
  if(el) el.focus();
}
// cfg: { parola: 'previsti'|'svolti', titoloSpunta, ridisegna() }
function bloccoArgomenti(m, cfg){
  if(!Array.isArray(m.argomenti)) m.argomenti = [];
  const det = document.createElement('details');
  det.className = 'blocco-argomenti';
  det.open = argomentiAperti.has(m.id);
  det.addEventListener('toggle', ()=>{ if(det.open) argomentiAperti.add(m.id); else argomentiAperti.delete(m.id); });
  const summary = document.createElement('summary');
  const aggiornaConteggio = ()=>{
    const tot = m.argomenti.length, fatti = m.argomenti.filter(a => a.fatto).length;
    summary.textContent = tot ? 'Argomenti: ' + fatti + ' su ' + tot + ' ' + cfg.parola : 'Argomenti: nessuno ancora';
  };
  aggiornaConteggio();
  det.appendChild(summary);

  const lista = document.createElement('div');
  lista.className = 'lista-argomenti';
  m.argomenti.forEach((a, k)=>{
    const r = document.createElement('div');
    r.className = 'riga-argomento' + (a.fatto ? '' : ' non-fatto');
    r.innerHTML = `
      <input type="checkbox" class="chk-argomento" title="${cfg.titoloSpunta}" ${a.fatto ? 'checked' : ''}>
      <input type="text" class="testo-argomento" placeholder="Scrivi l'argomento">
      <button class="icona-arg" data-az="su" title="Sposta su">↑</button>
      <button class="icona-arg" data-az="giu" title="Sposta giù">↓</button>
      <button class="icona-arg elimina-arg" data-az="elimina" title="Elimina argomento">✕</button>`;
    const testo = r.querySelector('.testo-argomento');
    testo.value = a.testo || '';
    testo.dataset.arg = a.id;
    testo.addEventListener('input', e=>{ a.testo = e.target.value; salvaDati(); });
    r.querySelector('.chk-argomento').addEventListener('change', e=>{
      a.fatto = e.target.checked;
      r.classList.toggle('non-fatto', !a.fatto);
      salvaDati(); aggiornaConteggio();
    });
    r.querySelector('[data-az=su]').addEventListener('click', ()=>{
      if(k > 0){ [m.argomenti[k-1], m.argomenti[k]] = [m.argomenti[k], m.argomenti[k-1]]; salvaDati(); cfg.ridisegna(); }
    });
    r.querySelector('[data-az=giu]').addEventListener('click', ()=>{
      if(k < m.argomenti.length - 1){ [m.argomenti[k+1], m.argomenti[k]] = [m.argomenti[k], m.argomenti[k+1]]; salvaDati(); cfg.ridisegna(); }
    });
    r.querySelector('[data-az=elimina]').addEventListener('click', ()=>{
      m.argomenti.splice(k, 1); salvaDati(); cfg.ridisegna();
    });
    lista.appendChild(r);
  });
  det.appendChild(lista);

  const azioni = document.createElement('div');
  azioni.className = 'azioni-argomenti';
  azioni.innerHTML = `<button class="btn-arg" data-az="nuovo">+ aggiungi argomento</button>`
    + (m.argomenti.length ? `<button class="btn-arg" data-az="tutti">spunta tutti</button><button class="btn-arg" data-az="nessuno">togli tutte le spunte</button>` : '');
  azioni.querySelector('[data-az=nuovo]').addEventListener('click', ()=>{
    const nuovo = { id: idCasuale(), testo: '', fatto: true };
    m.argomenti.push(nuovo);
    argomentiAperti.add(m.id);
    focusArgomento = nuovo.id;
    salvaDati(); cfg.ridisegna();
  });
  const btnTutti = azioni.querySelector('[data-az=tutti]');
  if(btnTutti) btnTutti.addEventListener('click', ()=>{ m.argomenti.forEach(a => a.fatto = true); salvaDati(); cfg.ridisegna(); });
  const btnNessuno = azioni.querySelector('[data-az=nessuno]');
  if(btnNessuno) btnNessuno.addEventListener('click', ()=>{ m.argomenti.forEach(a => a.fatto = false); salvaDati(); cfg.ridisegna(); });
  det.appendChild(azioni);

  const inc = document.createElement('details');
  inc.className = 'incolla-argomenti';
  const opzioni = '<option value="fine">in fondo</option><option value="inizio">all\'inizio</option>'
    + m.argomenti.map((a, k)=>{
        const t = (a.testo || '').trim() || '(vuoto)';
        return '<option value="' + a.id + '">dopo ' + (k+1) + '. ' + escapeHtml(t.length > 40 ? t.slice(0,40) + '…' : t) + '</option>';
      }).join('');
  inc.innerHTML = `
    <summary>Incolla un elenco di argomenti</summary>
    <textarea rows="5" placeholder="Uno per riga. Trattini e numeri all'inizio vengono tolti da soli."></textarea>
    <div class="azioni-argomenti">
      <span>Mettili</span>
      <select class="sel-pos-arg">${opzioni}</select>
      <label class="chk-gia"><input type="checkbox"> già spuntati</label>
      <button class="btn-arg forte" data-az="incolla">Aggiungi</button>
      <span class="esito-arg"></span>
    </div>`;
  inc.querySelector('[data-az=incolla]').addEventListener('click', ()=>{
    const righe = inc.querySelector('textarea').value.split('\n').map(pulisciRigaArgomento).filter(r => r.length > 0);
    if(!righe.length){ inc.querySelector('.esito-arg').textContent = 'Nessuna riga da aggiungere.'; return; }
    const gia = inc.querySelector('.chk-gia input').checked;
    const nuovi = righe.map(t => ({ id: idCasuale(), testo: t, fatto: gia }));
    const pos = inc.querySelector('.sel-pos-arg').value;
    if(pos === 'inizio') m.argomenti = nuovi.concat(m.argomenti);
    else {
      const idx = m.argomenti.findIndex(a => a.id === pos);
      if(pos === 'fine' || idx < 0) m.argomenti = m.argomenti.concat(nuovi);
      else m.argomenti.splice(idx + 1, 0, ...nuovi);
    }
    argomentiAperti.add(m.id);
    salvaDati(); cfg.ridisegna();
  });
  det.appendChild(inc);
  return det;
}
// Copia solo gli argomenti nei moduli con lo stesso nome, senza toccare lezioni, verifiche e approfondimenti.
function normaNomeArg(s){
  return (s || '').toLowerCase().replace(/[\u2019\u2018`\u00B4]/g, "'").replace(/[\u201C\u201D\u00AB\u00BB]/g, '"').replace(/\s+/g, ' ').trim();
}
function copiaSoloArgomenti(origine, destinazione, conSpunte){
  let moduliToccati = 0, aggiunti = 0;
  const senza = [];
  destinazione.moduli.forEach(m => {
    const o = origine.moduli.find(x => normaNomeArg(x.nome) === normaNomeArg(m.nome));
    if(!o){ senza.push(m.nome); return; }
    if(!Array.isArray(m.argomenti)) m.argomenti = [];
    const presenti = new Set(m.argomenti.map(a => normaNomeArg(a.testo)));
    let n = 0;
    (o.argomenti || []).forEach(a => {
      const chiave = normaNomeArg(a.testo);
      if(!chiave || presenti.has(chiave)) return;
      m.argomenti.push({ id: idCasuale(), testo: a.testo, fatto: conSpunte ? !!a.fatto : false });
      presenti.add(chiave); n++;
    });
    if(n){ moduliToccati++; aggiunti += n; }
  });
  return { moduliToccati, aggiunti, senza };
}
function messaggioSoloArgomenti(r, nomeOrigine){
  let t = r.aggiunti
    ? (r.aggiunti === 1 ? 'Copiato 1 argomento' : 'Copiati ' + r.aggiunti + ' argomenti') + ' da ' + nomeOrigine + ' in ' + r.moduliToccati + (r.moduliToccati === 1 ? ' modulo.' : ' moduli.')
    : 'Nessun argomento nuovo da copiare: i moduli corrispondenti li hanno già.';
  if(r.senza.length) t += '\n\nQuesti moduli non hanno un modulo con lo stesso nome in ' + nomeOrigine + ', quindi non sono stati toccati:\n- ' + r.senza.join('\n- ');
  return t;
}

// ---------- Rendering ----------

function render(){
  renderSidebar();
  renderMain();
}

function renderSidebar(){
  const cont = document.getElementById('lista-tab');
  cont.innerHTML = '';
  stato.piani.forEach(p => {
    const tab = document.createElement('div');
    tab.className = 'tab-piano' + (p.id===stato.pianoAttivo ? ' attivo':'');

// ---------- Eliminazione protetta e cestino ----------
// Per eliminare un piano lo si sceglie da un elenco a discesa; il piano va nel cestino e si può ripristinare.
let cestinoAperto = false, eliminaAperto = false;
function renderCestino(){
  const cont = document.getElementById('sezione-cestino');
  if(!cont) return;
  const cestino = stato.cestino || [];
  cont.innerHTML = `
    <details class="sezione-cestino" id="det-elimina" ${eliminaAperto ? 'open' : ''}>
      <summary>Elimina un piano</summary>
      <select id="sel-elimina-piano">
        <option value="">scegli il piano da eliminare…</option>
        ${stato.piani.map(p => `<option value="${p.id}">${escapeHtml(p.nome)}</option>`).join('')}
      </select>
      <button class="btn-piccolo rosso" id="btn-elimina-piano" disabled>Sposta nel cestino</button>
    </details>
    ${cestino.length ? `
    <details class="sezione-cestino" id="det-cestino" ${cestinoAperto ? 'open' : ''}>
      <summary>Piani eliminati (${cestino.length})</summary>
      ${cestino.map((c, i) => `<div class="riga-cestino">
        <div>${escapeHtml(c.piano.nome)}<div class="data-cestino">eliminato il ${formattaDataBreve(c.eliminatoIl)}</div></div>
        <div style="display:flex; gap:4px;">
          <button class="btn-piccolo" data-ripristina="${i}">Ripristina</button>
          <button class="btn-piccolo rosso" data-definitivo="${i}" title="Elimina per sempre">✕</button>
        </div></div>`).join('')}
    </details>` : ''}`;
  cont.querySelector('#det-elimina').addEventListener('toggle', e => eliminaAperto = e.target.open);
  const detC = cont.querySelector('#det-cestino');
  if(detC) detC.addEventListener('toggle', e => cestinoAperto = e.target.open);
  const sel = cont.querySelector('#sel-elimina-piano');
  const btn = cont.querySelector('#btn-elimina-piano');
  sel.addEventListener('change', ()=> btn.disabled = !sel.value);
  btn.addEventListener('click', ()=>{
    const p = stato.piani.find(x => x.id === sel.value);
    if(!p) return;
    if(!confirm('Spostare «' + p.nome + '» nel cestino?\n\nPotrai ripristinarlo da «Piani eliminati».')) return;
    eliminaPiano(p.id);
  });
  cont.querySelectorAll('[data-ripristina]').forEach(b => b.addEventListener('click', ()=>{
    const i = Number(b.dataset.ripristina);
    const c = stato.cestino[i];
    stato.cestino.splice(i, 1);
    stato.piani.push(c.piano);
    stato.pianoAttivo = c.piano.id;
    salvaDati(); render();
    mostraNotaBackup('«' + c.piano.nome + '» ripristinato.', 'ok');
  }));
  cont.querySelectorAll('[data-definitivo]').forEach(b => b.addEventListener('click', ()=>{
    const i = Number(b.dataset.definitivo);
    const c = stato.cestino[i];
    if(!confirm('Eliminare PER SEMPRE «' + c.piano.nome + '»? Questa volta non si potrà recuperare.')) return;
    stato.cestino.splice(i, 1);
    salvaDati(); render();
  }));
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s||'';
  // anche le virgolette, altrimenti i titoli con "..." si troncano dentro i campi
  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function catturaStatoPannelli(){
  const ids = ['pannello-impostazioni','pannello-civica','pannello-moduli','pannello-gsl','pannello-eccezioni'];
  const stato = {};
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(el) stato[id] = el.open;
  });
  return stato;
}
function ripristinaStatoPannelli(stato){
  Object.keys(stato).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.open = stato[id];
  });
}

          moduli: (v.moduli || []).map(x => mappa[x]).filter(Boolean)

    mostraNotaBackup(copiati.length + ' moduli copiati da ' + origine.nome + (conVerifiche ? ' con le verifiche.' : '.'), 'ok');

  renderPannelloDiagramma(piano, calcolo);

// ---------- Esportazione crono programma in RTF (Word, Pages, TextEdit) ----------

function rtfEscape(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\')
    .replace(/\{/g,'\\{')
    .replace(/\}/g,'\\}')
    .replace(/\n/g,'\\line ')
    .replace(/[\u0080-\uffff]/g, c => '\\u' + c.charCodeAt(0) + '?');
}

// Report stampabile con il diagramma: si apre in una finestra nuova,
// da lì Cmd+P e "Salva come PDF" per condividerlo con la classe.
function reportConGrafico(piano, calcolo){
  if(!piano.dataInizio || !piano.dataFine || !piano.moduli.length){
    alert('Servono le date del periodo e almeno un modulo.'); return;
  }
  const inizio = parseISO(piano.dataInizio), fine = parseISO(piano.dataFine);
  const totaleGiorni = Math.max(1, (fine - inizio) / 86400000);

  let mesi = '', cur = new Date(inizio.getFullYear(), inizio.getMonth(), 1);
  while(cur <= fine){
    const iSeg = cur < inizio ? inizio : new Date(cur);
    const fMese = new Date(cur.getFullYear(), cur.getMonth()+1, 0);
    const fSeg = fMese > fine ? fine : fMese;
    const g = Math.max(1, (fSeg - iSeg)/86400000 + 1);
    mesi += `<div class="mese" style="flex:${g} 0 0">${MESI_LABEL[cur.getMonth()].slice(0,3)}</div>`;
    cur.setMonth(cur.getMonth()+1);
  }

  let barre = '';
  calcolo.righe.forEach((r, i) => {
    const dIn = parseISO(r.dataInizio), dFi = parseISO(r.dataFineTotale);
    const left = Math.max(0, (dIn - inizio)/86400000 / totaleGiorni * 100);
    const width = Math.max(1.5, ((dFi - dIn)/86400000 + 1) / totaleGiorni * 100);
    barre += `<div class="riga-g">
      <div class="etichetta-g">${i+1}. ${escapeHtml(r.modulo.nome)}</div>
      <div class="pista"><div class="barra" style="left:${left}%; width:${width}%; background:${PALETTE_BARRE[i % PALETTE_BARRE.length]}">
        ${formattaDataBreve(r.dataInizio)} – ${formattaDataBreve(r.dataFineTotale)}</div></div>
    </div>`;
  });

  gruppiCivica(calcolo).forEach(g => {
    const dIn = parseISO(g.dal), dFi = parseISO(g.al);
    const left = Math.max(0, (dIn - inizio)/86400000 / totaleGiorni * 100);
    const width = Math.max(1.5, ((dFi - dIn)/86400000 + 1) / totaleGiorni * 100);
    barre += `<div class="riga-g">
      <div class="etichetta-g">Educazione civica</div>
      <div class="pista"><div class="barra" style="left:${left}%; width:${width}%; background:#A84A6E">
        ${formattaDataBreve(g.dal)} – ${formattaDataBreve(g.al)}</div></div>
    </div>`;
  });

  let righeTab = '';
  calcolo.righe.forEach((r, i) => {
    const argR = argomentiSpuntati(r.modulo);

function esportaCronoProgrammaWord(piano, calcolo){
  // larghezze colonne in twips (1440 twips = 1 pollice)
  const larghezze = [2900, 1400, 1400, 1100, 3200];

  function rigaTabella(celle, grassetto, larghezzeRiga){
    const ws = larghezzeRiga || larghezze;
    let cumR = 0;
    const cellxR = ws.map(w => (cumR += w));
    let r = '\\trowd\\trgaph108\\trleft0';
    cellxR.forEach(x => r += '\\cellx' + x);
    r += '\n\\intbl ';
    celle.forEach(c => {
      r += (grassetto ? '\\b ' : '') + rtfEscape(c) + (grassetto ? '\\b0' : '') + '\\cell ';
    });
    r += '\\row\n';
    return r;
  }

  let rtf = '{\\rtf1\\ansi\\ansicpg1252\\deff0\\deflang1040{\\fonttbl{\\f0\\fswiss\\fcharset0 Calibri;}}\n';
  rtf += '\\f0\\fs22\n';
  rtf += '{\\pard\\b\\fs32 Programmazione \\emdash ' + rtfEscape(piano.nome) + '\\par}\n';
  rtf += '{\\pard\\fs18\\sa240 Periodo: ' + rtfEscape(formattaDataBreve(piano.dataInizio)) + ' \\endash ' + rtfEscape(formattaDataBreve(piano.dataFine)) + '   \\emdash   ' + calcolo.lezioniTotali + ' lezioni disponibili nel periodo\\par}\n';
  rtf += rigaTabella(['Modulo','Lezioni spiegazione','Lezioni verifica','Totale','Periodo previsto'], true);
  calcolo.righe.forEach((r, i)=>{
    rtf += rigaTabella([
      (i+1) + '. ' + r.modulo.nome + (argomentiSpuntati(r.modulo).length ? '\nArgomenti: ' + argomentiSpuntati(r.modulo).join('; ') + '.' : ''),
      String(r.lezioniPreviste),
      r.lezioniVerifica > 0 ? String(r.lezioniVerifica) : '\u2013',
      String(r.lezioniPreviste + r.lezioniVerifica),
      formattaDataBreve(r.dataInizio) + ' \u2013 ' + formattaDataBreve(r.dataFineTotale) + (r.overflow ? ' (lezioni insufficienti)' : '')
    ]);
  });

  gruppiCivica(calcolo).forEach(g => {
    rtf += '{\\pard\\sb120\\fs20 ' + rtfEscape(testoCivica(g)) + '\\par}\n';
  });

  if((calcolo.verifiche||[]).length > 0){
    const verificheOrdinate = calcolo.verifiche.slice()
      .filter(pv => pv.attiva && pv.date.length > 0)
      .sort((a,b)=> a.date[0].localeCompare(b.date[0]));
    if(verificheOrdinate.length > 0){
      rtf += '\\pard\\par\n';
      rtf += '{\\pard\\b\\fs26\\sb240 Calendario verifiche\\par}\n';
      rtf += '{\\pard\\sa120\\fs18 Le date potranno subire lievi variazioni in base allo svolgimento effettivo del programma.\\par}\n';
      const larghezzeVerifiche = [3600, 2200, 4200];
      rtf += rigaTabella(['Modulo','Tipo','Data / periodo'], true, larghezzeVerifiche);
      verificheOrdinate.forEach(pv=>{
        const tipo = (pv.verifica.tipo==='orale'?'Orale':'Scritta') + (pv.verifica.qualifica==='recupero'?' (recupero)':'');
        rtf += rigaTabella([
          piano.moduli.reduce((acc, mm, k) => {
            const inclusi = mm.id === pv.modulo.id || (pv.verifica.moduli||[]).includes(mm.id);
            return inclusi ? acc.concat((k+1) + '. ' + mm.nome) : acc;
          }, []).join('  '),
          tipo,
          formattaDataBreve(pv.date[0]) + (pv.date.length>1 ? ' \u2013 ' + formattaDataBreve(pv.date[pv.date.length-1]) : '')
        ], false, larghezzeVerifiche);
      });
    }
  }

  {
    const r = riepilogoVerifiche(piano, calcolo);
    rtf += '{\\pard\\b\\fs26\\sb240 Riepilogo delle verifiche\\par}\n';
    const larghezzeRiep = [4200, 1300, 1500, 1300, 1600];
    rtf += rigaTabella(['Periodo','Totale','Scritte','Orali','Lezioni impiegate'], true, larghezzeRiep);
    const riga = (nome, d) => rigaTabella([nome, String(d.totale), String(d.scritte), String(d.orali), String(d.lezioni)], false, larghezzeRiep);
    rtf += riga('Primo quadrimestre (fino al ' + formattaDataBreve(r.limite) + ')', r.primo);
    rtf += riga('Secondo quadrimestre', r.secondo);
    rtf += riga('Totale anno', r.totale);
    if(r.totale.recuperi > 0){
      rtf += '{\\pard\\sa120\\fs18 Di cui verifiche di recupero: ' + r.totale.recuperi + '.\\par}\n';
    }
  }

  rtf += '\\pard\\par}';

  const blob = new Blob([rtf], { type: 'application/rtf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const nomeFile = piano.nome.replace(/[^a-z0-9àèéìòù ]/gi,'').trim().replace(/\s+/g,'_') || 'piano';
  a.download = 'Programmazione_' + nomeFile + '.rtf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------- Contenuti per mese (per la tabella del modello di programmazione della scuola) ----------
// Per ogni mese del periodo elenca, in ordine di data, i moduli spiegati in quel mese e i progetti
// di educazione civica. Nel primo mese il modulo compare con gli argomenti; poi con "(prosecuzione)".
// tuttiGliArgomenti: true = tutti gli argomenti del modulo, false = solo quelli spuntati.
function contenutiPerMese(piano, calcolo, tuttiGliArgomenti){
  const inizio = parseISO(piano.dataInizio), fine = parseISO(piano.dataFine);
  const mesi = [];
  let cur = new Date(inizio.getFullYear(), inizio.getMonth(), 1);
  while(cur <= fine){
    mesi.push({ anno: cur.getFullYear(), mese: cur.getMonth(), voci: [] });
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
  const argomenti = m => tuttiGliArgomenti
    ? (m.argomenti || []).map(a => (a.testo || '').trim().replace(/[.;]+$/, '')).filter(Boolean)
    : argomentiSpuntati(m);
  const aggiungi = (dal, al, titolo, arg, civica) => {
    const dIn = parseISO(dal), dFi = parseISO(al);
    let primo = true;
    mesi.forEach(m => {
      const iniMese = new Date(m.anno, m.mese, 1), fineMese = new Date(m.anno, m.mese+1, 0);
      if(dIn <= fineMese && dFi >= iniMese){
        const ordine = toISO(dIn > iniMese ? dIn : iniMese);
        m.voci.push({ ordine, civica, titolo: titolo + (primo ? '' : ' (prosecuzione)'), argomenti: primo ? arg : [] });
        primo = false;
      }
    });
  };
  calcolo.righe.forEach(r => {
    if(!r.lezioniAssegnate) return;
    aggiungi(r.dataInizio, r.dataFine, r.modulo.nome, argomenti(r.modulo), false);
  });
  gruppiCivica(calcolo).forEach(g => {
    aggiungi(g.dal, g.al, 'Educazione civica' + (g.titolo ? ': «' + g.titolo + '»' : ''), [], true);
  });
  mesi.forEach(m => m.voci.sort((x, y) => x.ordine < y.ordine ? -1 : x.ordine > y.ordine ? 1 : 0));
  return mesi;
}

// Tabelle pronte per il modello della scuola, in RTF (si apre con Word/Pages):
// "Contenuti – Filosofia" e "Contenuti – Storia" mese per mese (tutti i piani della classe) + tabella di Educazione civica.
function rtfTabelleModello(piano, tuttiGliArgomenti){
  const fratelli = (piano.anno && piano.sezione ? stato.piani.filter(p => stessaClasse(p, piano)) : [piano])
    .slice().sort((a, b) => (a.materia === 'Filosofia' ? 0 : 1) - (b.materia === 'Filosofia' ? 0 : 1));
  const riga = (celle, larghezze, grassetto, sfondo) => {
    let cum = 0;
    let r = '\\trowd\\trgaph108\\trleft0';
    larghezze.forEach(w => {
      r += '\\clbrdrt\\brdrs\\brdrw10\\clbrdrl\\brdrs\\brdrw10\\clbrdrb\\brdrs\\brdrw10\\clbrdrr\\brdrs\\brdrw10' + (sfondo ? '\\clcbpat2' : '') + '\\cellx' + (cum += w);
    });
    r += '\n\\pard\\intbl ';
    celle.forEach(c => r += (grassetto ? '\\b ' : '') + c + (grassetto ? '\\b0' : '') + '\\cell ');
    return r + '\\row\n';
  };
  let rtf = '{\\rtf1\\ansi\\ansicpg1252\\deff0\\deflang1040{\\fonttbl{\\f0\\fswiss\\fcharset0 Calibri;}}{\\colortbl;\\red0\\green0\\blue0;\\red243\\green236\\blue224;}\n\\f0\\fs22\n';
  rtf += '{\\pard\\b\\fs28 Classe ' + rtfEscape((piano.anno || '') + (piano.sezione || '')) + ' \\emdash  tabelle per la programmazione\\par}\n{\\pard\\par}\n';
  const L = [1900, 7700];
  fratelli.forEach(p => {
    const calc = calcolaPianificazione(p);
    const mesi = contenutiPerMese(p, calc, tuttiGliArgomenti);
    rtf += riga([rtfEscape('CONTENUTI \u2013 ' + (p.materia || p.nome).toUpperCase())], [L[0] + L[1]], true, true);
    mesi.forEach(m => {
      const fuoriModello = m.mese === 5 || m.mese === 6 || m.mese === 7; // giugno-agosto
      if(fuoriModello && !m.voci.length) return;
      const nome = MESI_LABEL[m.mese].charAt(0).toUpperCase() + MESI_LABEL[m.mese].slice(1);
      const testo = m.voci.map(v => '\\b ' + rtfEscape(v.titolo) + '\\b0' + (v.argomenti.length ? '\\line ' + rtfEscape(v.argomenti.join('; ') + '.') : '')).join('\\line ');
      rtf += riga(['\\b ' + rtfEscape(nome) + '\\b0', testo], L, false, false);
    });
    rtf += '{\\pard\\par}\n';
  });
  const progetti = progettiCivicaClasse(piano);
  if(progetti.length){
    const materie = fratelli.map(p => (p.materia || '').toUpperCase()).filter(Boolean);
    rtf += riga([rtfEscape('EDUCAZIONE CIVICA')], [9600], true, true);
    rtf += riga([rtfEscape('La Programmazione individuale di Educazione civica si inserisce nella Programmazione delle attivit\u00e0 decisa dal Consiglio di Classe ed \u00e8 in linea con quanto stabilito dal Piano di Istituto. Per le materie ' +
      (materie.length ? materie.join(' e ') : 'FILOSOFIA e STORIA') + ' \u00e8 previsto un monte ore pari a ' + monteOreCivica(piano) + ' ore.')], [9600], false, false);
    const L4 = [2400, 2400, 2400, 2400];
    progetti.forEach(c => {
      rtf += riga(['\\b ' + rtfEscape(c.titolo || 'Progetto') + '\\b0 ' + (c.area ? rtfEscape(' \u2014 Area: ' + c.area) : '')], [9600], false, false);
      rtf += riga(['Contenuti', 'Attivit\\u224?', 'Competenze trasversali', 'Competenze specifiche'], L4, true, true);
      rtf += riga([c.contenuti, c.attivita, c.compTrasversali, c.compSpecifiche].map(t => rtfEscape((t || '').trim())), L4, false, false);
    });
  }
  return rtf + '{\\pard\\par}}';
}

        const fatto = () => { const t = btn.textContent; btn.textContent = 'Copiato ✓'; btn.classList.add('ok');
          setTimeout(()=>{ btn.textContent = t; btn.classList.remove('ok'); }, 1500); };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(testo).then(fatto, () => vecchioModo(testo, fatto));
        } else vecchioModo(testo, fatto);
      }
      function vecchioModo(testo, fatto){
        const ta = document.createElement('textarea'); ta.value = testo; document.body.appendChild(ta);
        ta.select(); try{ document.execCommand('copy'); fatto(); }catch(e){ alert('Copia non riuscita: seleziona il testo col mouse.'); }
        document.body.removeChild(ta);
      }
      function copia(k, btn){ scrivi(testoMese(DATI[scelta()][k]), btn); }
      function disegnaCivica(){
        const c = DATI.civica, box = document.getElementById('civica');
        if(!c){ box.innerHTML = ''; return; }
        const campi = [['contenuti','Contenuti'],['attivita','Attività'],['compTrasversali','Competenze trasversali'],['compSpecifiche','Competenze specifiche']];
        box.innerHTML = '<h2>Educazione civica</h2><div class="frase">' + esc(c.frase) + '<br><button onclick="scrivi(DATI.civica.frase, this)">Copia</button></div>' +
          c.progetti.map((p, i) => '<div class="titprog">' + esc(p.titolo || 'Progetto') + (p.area ? ' — Area: ' + esc(p.area) : '') + '</div>' +
            '<table class="civ"><thead><tr>' + campi.map(f => '<th>' + f[1] + '</th>').join('') + '</tr></thead><tbody><tr>' +
            campi.map(f => '<td>' + (p[f[0]] ? esc(p[f[0]]) + '<br><button onclick="scrivi(DATI.civica.progetti[' + i + '].' + f[0] + ', this)">Copia</button>' : '<span class="vuoto">— da compilare nel pianificatore</span>') + '</td>').join('') +
            '</tr></tbody></table>').join('');
      }
      function scaricaWord(){
        const blob = new Blob([DATI.rtf[scelta()]], { type: 'application/rtf' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = DATI.nomeFileWord;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
      function copiaTutto(btn){ scrivi(DATI[scelta()].map(m => m.nome + '\\t' + testoMese(m).replace(/\\n/g, ' — ')).join('\\n'), btn); }
      disegna();
      disegnaCivica();
    <\/script>
  </body></html>`;

  const w = window.open('', '_blank');
  if(!w){ alert('Il browser ha bloccato la finestra. Consenti i popup per questo sito e riprova.'); return; }
  w.document.write(html);
  w.document.close();
}

// Raggruppa le lezioni di educazione civica del piano per progetto.
function gruppiCivica(calcolo){
  const g = {};
  (calcolo.civica||[]).forEach(l => {
    const k = l.progetto.id;
    if(!g[k]) g[k] = { titolo: l.progetto.titolo || '', dal: l.iso, al: l.iso, n: 0, date: [] };
    g[k].al = l.iso; g[k].n++; g[k].date.push(l.iso);
  });
  return Object.values(g).sort((a, b) => a.dal < b.dal ? -1 : 1);
}
function testoCivica(g){
  return 'Educazione civica' + (g.titolo ? ': ' + g.titolo : '') + ' (' +
    (g.dal === g.al ? formattaDataBreve(g.dal) : formattaDataBreve(g.dal) + ' \u2013 ' + formattaDataBreve(g.al)) +
    '; ' + g.n + ' ' + (g.n===1 ? 'lezione' : 'lezioni') + ' in questa materia)';
}

function formattaDataBreve(iso){
  if(!iso) return '';
  const d = parseISO(iso);
  return String(d.getDate()).padStart(2,'0') + ' ' + MESI_LABEL[d.getMonth()].slice(0,3) + ' ' + d.getFullYear();
}

// Ordina le festività in ordine cronologico (per data di inizio, poi di fine).
function ordinaFestivita(piano){
  const chiave = f => (f.da || '9999') + '|' + (f.a || '9999');
  const prima = piano.festivita.map(chiave).join(',');
  piano.festivita.sort((x, y) => chiave(x) < chiave(y) ? -1 : chiave(x) > chiave(y) ? 1 : 0);
  return prima !== piano.festivita.map(chiave).join(',');
}

// Inserisce i moduli nuovi nella posizione scelta nel menu "I moduli nuovi vanno".
function inserisciModuli(piano, nuovi){
  const sel = document.getElementById('sel-posizione-moduli');
  const pos = sel ? sel.value : 'fine';
  if(pos === 'inizio'){ piano.moduli = nuovi.concat(piano.moduli); return; }
  const idx = piano.moduli.findIndex(m => m.id === pos);
  if(pos === 'fine' || idx < 0){ piano.moduli = piano.moduli.concat(nuovi); return; }
  piano.moduli.splice(idx + 1, 0, ...nuovi);
}

      <button class="btn-precompila" id="btn-sel-tutti-moduli">Seleziona tutti</button>
      <button class="btn-precompila" id="btn-desel-moduli">Deseleziona</button>
    </div>`;
  cont.querySelector('#btn-sposta-moduli').addEventListener('click', ()=>{
    const pos = cont.querySelector('#sel-sposta-moduli').value;
    const blocco = piano.moduli.filter(m => moduliSelPiano.has(m.id));
    const resto = piano.moduli.filter(m => !moduliSelPiano.has(m.id));
    if(pos === 'inizio') piano.moduli = blocco.concat(resto);
    else if(pos === 'fine') piano.moduli = resto.concat(blocco);
    else {
      const idx = resto.findIndex(m => m.id === pos);
      resto.splice(idx + 1, 0, ...blocco);
      piano.moduli = resto;
    }
    moduliSelPiano.clear();
    salvaDati(); render();
  });
  cont.querySelector('#btn-sel-tutti-moduli').addEventListener('click', ()=>{ piano.moduli.forEach(m => moduliSelPiano.add(m.id)); renderTabellaModuli(piano); });
  cont.querySelector('#btn-desel-moduli').addEventListener('click', ()=>{ moduliSelPiano.clear(); renderTabellaModuli(piano); });
}

function renderMiniCalendario(piano, calcolo){
  const cont = document.getElementById('mini-calendario');
  cont.innerHTML = '';
  if(!piano.dataInizio || !piano.dataFine){ return; }
  const wrap = document.createElement('div');
  wrap.className = 'mesi-calendario';
  const lezioniSet = new Set(calcolo.lezioni);
  const saltateMap = {}; const extraMap = {};
  piano.eccezioni.forEach(e=>{ if(e.tipo==='saltata') saltateMap[e.data]=true; if(e.tipo==='extra') extraMap[e.data]=true; });
  const verificheMap = {};
  (calcolo.verifiche||[]).forEach(pv => { if(pv.attiva) pv.date.forEach(iso => { verificheMap[iso] = pv; }); });
  const civicaMap = {};
  (calcolo.civica||[]).forEach(l => civicaMap[l.iso] = l.progetto);
  const gg0 = iso => giornoSettimanaLunBase(parseISO(iso));

  let cursore = new Date(parseISO(piano.dataInizio).getFullYear(), parseISO(piano.dataInizio).getMonth(), 1);
  const fine = parseISO(piano.dataFine);
  let guardia = 0;
  while(cursore <= fine && guardia < 36){
    guardia++;
    const meseDiv = document.createElement('div');
    meseDiv.className = 'mese-cal';
    const titolo = document.createElement('div');
    titolo.className = 'titolo-mese';
    titolo.textContent = MESI_LABEL[cursore.getMonth()] + ' ' + cursore.getFullYear();
    meseDiv.appendChild(titolo);
    const griglia = document.createElement('div');
    griglia.className = 'griglia-giorni';
    const primoDelMese = new Date(cursore.getFullYear(), cursore.getMonth(), 1);
    const offset = giornoSettimanaLunBase(primoDelMese);
    for(let v=0; v<offset; v++){
      const vuota = document.createElement('div'); vuota.className='giorno-cella vuota'; griglia.appendChild(vuota);
    }
    const giorniNelMese = new Date(cursore.getFullYear(), cursore.getMonth()+1, 0).getDate();
    for(let g=1; g<=giorniNelMese; g++){
      const d = new Date(cursore.getFullYear(), cursore.getMonth(), g);
      const iso = toISO(d);
      const cella = document.createElement('div');
      const verificaQui = verificheMap[iso];
      let cls = 'giorno-cella';
      const gslQui = (piano.giorni.includes(gg0(iso)) && !inFestivita(iso, piano.festivita)) ? giornoSenzaLezione(iso, piano) : null;
      if(verificaQui) cls += ' verifica';
      else if(gslQui) cls += ' senza';
      else if(civicaMap[iso]) cls += ' civica';
      else if(saltateMap[iso]) cls += ' saltata';
      else if(extraMap[iso]) cls += ' extra';
      else if(lezioniSet.has(iso)) cls += ' lezione';
      cella.className = cls;
      cella.textContent = g;
      cella.title = verificaQui ? verificaQui.etichetta : (civicaMap[iso] ? 'Educazione civica' + (civicaMap[iso].titolo ? ': ' + civicaMap[iso].titolo : '') : iso);
      if(gslQui){
        cella.title = gslQui.tipo + (gslQui.descrizione && gslQui.descrizione !== gslQui.tipo ? ': ' + gslQui.descrizione : '');
        cella.addEventListener('click', ()=> alert('Giorno senza lezione — ' + cella.title + '.\n\nPer cambiarlo usa il riquadro «Giorni senza lezione».'));
      } else if(verificaQui){
        // la data della verifica deriva dal modulo: si sposta da sola se il modulo slitta.
        // Per segnare il giorno come saltato (es. sciopero proprio quel giorno), clic: diventa saltata e la verifica scorre avanti.
        cella.addEventListener('click', ()=> toggleGiornoCalendario(piano, iso, true, false, false));
      } else if(iso >= piano.dataInizio && iso <= piano.dataFine){
        cella.addEventListener('click', ()=> toggleGiornoCalendario(piano, iso, lezioniSet.has(iso) || !!civicaMap[iso] || saltateMap[iso] || extraMap[iso], saltateMap[iso], extraMap[iso]));
      } else {
        cella.style.opacity = '0.3';
      }
      griglia.appendChild(cella);
    }
    meseDiv.appendChild(griglia);
    wrap.appendChild(meseDiv);
    cursore.setMonth(cursore.getMonth()+1);
  }
  cont.appendChild(wrap);
}

function toggleGiornoCalendario(piano, iso, eraLezioneOEccezione, eraSaltata, eraExtra){
  // ciclo di stato per il giorno cliccato:
  // lezione regolare -> saltata -> regolare
  // giorno non di lezione -> extra -> non di lezione
  const gg = giornoSettimanaLunBase(parseISO(iso));
  const regolare = piano.giorni.includes(gg) && !inFestivita(iso, piano.festivita);

  // giorni saltati: se richiesto, anche negli altri piani della stessa classe che hanno lezione quel giorno
  const inClasse = stato.saltaInClasse !== false && piano.anno && piano.sezione;
  const altri = inClasse ? stato.piani.filter(p => p.id !== piano.id && stessaClasse(p, piano)) : [];
  const haLezione = p => p.giorni.includes(gg) && !inFestivita(iso, p.festivita);
  let nota = '';

  if(eraSaltata){
    piano.eccezioni = piano.eccezioni.filter(e => !(e.data===iso && e.tipo==='saltata'));
    const toccati = altri.filter(p => p.eccezioni.some(e => e.data===iso && e.tipo==='saltata'));
    toccati.forEach(p => p.eccezioni = p.eccezioni.filter(e => !(e.data===iso && e.tipo==='saltata')));
    if(toccati.length) nota = formattaDataBreve(iso) + ': tolto il giorno saltato anche in ' + toccati.map(p => p.nome).join(', ') + '.';
  } else if(eraExtra){
    piano.eccezioni = piano.eccezioni.filter(e => !(e.data===iso && e.tipo==='extra'));
  } else if(regolare){
    piano.eccezioni.push({ data: iso, tipo:'saltata', etichetta:'' });
    if(inClasse){
      const conLezione = altri.filter(haLezione);
      conLezione.forEach(p => { if(!p.eccezioni.some(e => e.data===iso && e.tipo==='saltata')) p.eccezioni.push({ data: iso, tipo:'saltata', etichetta:'' }); });
      const senza = altri.filter(p => !haLezione(p));
      nota = formattaDataBreve(iso) + ': giorno saltato in ' + [piano, ...conLezione].map(p => p.nome).join(', ') +
        (senza.length ? ' (' + senza.map(p => p.nome).join(', ') + ': nessuna lezione quel giorno)' : '') + '.';
    }
  } else {
    piano.eccezioni.push({ data: iso, tipo:'extra', etichetta:'' });
  }
  salvaDati();
  render();
  if(nota) mostraNotaBackup(nota, 'ok');
}

function renderGanttOnly(){
  const piano = pianoCorrente();
  if(!piano) return;
  const calcolo = calcolaPianificazione(piano);
  renderMiniCalendario(piano, calcolo);
  renderPannelloDiagramma(piano, calcolo);
}

// Ricostruisce SEMPRE insieme riepilogo, avviso ed esportazione: qualunque modifica
// (lezione saltata, vacanza, numero di lezioni di un modulo) passa da qui, così
// il conteggio "lezioni mancanti" non resta mai disallineato dal resto.
// 31 gennaio dell'anno in cui cade la fine delle lezioni.
function defaultFineQuadrimestre(piano){
  const anno = piano.dataFine ? Number(piano.dataFine.slice(0,4)) : new Date().getFullYear();
  return anno + '-01-31';
}

// Conta le verifiche per quadrimestre, distinte per tipo.
function riepilogoVerifiche(piano, calcolo){
  const limite = piano.fineQuadrimestre || defaultFineQuadrimestre(piano);
  const vuoto = ()=>({ scritte:0, orali:0, recuperi:0, lezioni:0, totale:0 });
  const q = [vuoto(), vuoto()];
  (calcolo.verifiche||[]).forEach(pv => {
    if(!pv.date || !pv.date.length) return;
    const i = pv.date[0] <= limite ? 0 : 1;
    q[i].totale++;
    q[i].lezioni += pv.date.length;
    if(pv.verifica.tipo === 'orale') q[i].orali++; else q[i].scritte++;
    if(pv.verifica.qualifica === 'recupero') q[i].recuperi++;
  });
  const tot = vuoto();
  ['scritte','orali','recuperi','lezioni','totale'].forEach(k => tot[k] = q[0][k] + q[1][k]);
  return { limite, primo:q[0], secondo:q[1], totale:tot };
}

function rigaRiepilogo(nome, d){
  return `<tr><td>${nome}</td><td>${d.totale}</td><td>${d.scritte}</td><td>${d.orali}</td><td>${d.recuperi}</td><td>${d.lezioni}</td></tr>`;
}
